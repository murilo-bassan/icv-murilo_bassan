<style>
/* Layout: full-screen 3D planet; header top, detail panel right, timeline bottom. */
:root{
  color-scheme:dark;
  --night:#17122b;      /* deep ink-violet sky */
  --mint:#7cf0d0;       /* graph edges, focus */
  --amber:#ffb347;      /* data packets, work */
  --violet:#a98cff;     /* atmosphere, education */
  --paper:#eef1f7;
  --muted:#aaa6c6;
  --line:rgba(238,241,247,.14);
  --glass:rgba(23,18,43,.74);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#labels{position:fixed;inset:0;pointer-events:none;transition:opacity .8s}
.label{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;transition:opacity .3s}
.label .in{display:flex;align-items:center;gap:9px;transform:translate(-6px,-50%);white-space:nowrap;font-size:13px;font-weight:600;text-shadow:0 1px 10px rgba(12,8,28,.95),0 0 2px rgba(12,8,28,.9)}
.label .dot{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);border:2px solid var(--c,var(--mint));background:rgba(23,18,43,.5);transition:background .2s;flex:none}
.label:hover .dot,.label.hover .dot,.label.active .dot{background:var(--c,var(--mint))}
.label.active .dot{box-shadow:0 0 0 5px rgba(124,240,208,.22)}
.label.node .in{font-size:12.5px;font-weight:500;color:#dcdaf0}
.label.hidden{opacity:0;pointer-events:none}

#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 28px;pointer-events:none;z-index:6}
#top>*{pointer-events:auto}
.brand{cursor:pointer;text-align:left;transition:opacity .8s}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.1}
.brand p{font-size:13px;color:var(--muted);margin-top:5px}
nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:720px}
nav button,nav a{font-size:13px;font-weight:600;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(23,18,43,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none;color:var(--paper);transition:border-color .2s,color .2s,opacity .8s}
nav button:hover,nav a:hover{border-color:var(--mint);color:var(--mint)}
nav .tour{background:var(--mint);color:#0f2a24;border-color:var(--mint)}
nav .tour:hover{color:#0f2a24;filter:brightness(1.08)}
.lang{display:flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(23,18,43,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lang button{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;color:var(--muted);border:0;background:none}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--night)}
.lang button:hover{color:var(--paper)}
.lang button[aria-pressed="true"]:hover{color:var(--night)}

#panel{position:fixed;right:24px;top:100px;bottom:200px;width:min(420px,calc(100vw - 48px));background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:6px 22px 22px 22px;padding:30px 30px 22px;overflow:auto;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;scrollbar-width:thin}
#panel.open{transform:none;opacity:1}
#close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted)}
#close:hover{color:var(--mint);border-color:var(--mint)}
.kicker{font-size:13px;color:var(--mint);font-weight:600;padding-right:36px}
#panel h2{font-family:var(--display);font-weight:700;font-size:29px;line-height:1.1;letter-spacing:-.015em;margin:10px 0 8px;text-wrap:balance}
.org{color:var(--muted);font-size:14.5px;line-height:1.45}
#panel p.body{font-size:15px;line-height:1.65;margin-top:18px;color:#dedcee}
#panel ul{list-style:none;margin:20px 0 6px}
#panel li{padding:11px 0 11px 20px;position:relative;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
#panel li::before{content:"";position:absolute;left:1px;top:18px;width:8px;height:8px;border-radius:50%;border:2px solid var(--amber)}
#panel h3{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid rgba(124,240,208,.35);color:#cdf7ea;background:rgba(124,240,208,.07)}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.pnav button{font-size:13px;font-weight:600;color:var(--muted);padding:6px 0;text-align:left}
.pnav button:last-child{text-align:right}
.pnav button:hover{color:var(--mint)}
.pnav small{display:block;font-weight:500;font-size:11.5px;opacity:.7}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.fact{border:1px solid var(--line);border-radius:14px;padding:12px}
.fact b{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber)}
.fact span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.links a{font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:999px;text-decoration:none;border:1px solid var(--line);color:var(--paper)}
.links a.primary{background:var(--mint);border-color:var(--mint);color:#0f2a24}
.links a:hover{border-color:var(--mint)}
.contact .crow,.contact a.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--paper)}
.contact .crow strong{display:block;font-size:15px;font-weight:600;user-select:all;word-break:break-all}
.contact span{color:var(--muted);font-size:13px}
.contact a.row{font-size:15px}
.contact a.row:hover{color:var(--mint)}
.copy{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);flex:none}
.copy:hover{border-color:var(--mint);color:var(--mint)}
.card{display:block;width:100%;text-align:left;padding:14px 14px 14px 16px;border:1px solid var(--line);border-radius:14px;margin-top:10px;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--c,var(--mint));background:rgba(255,255,255,.03)}
.card strong{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.card strong i{width:11px;height:11px;border-radius:2px;transform:rotate(45deg);background:var(--c,var(--mint));flex:none}
.card p{font-size:14px;line-height:1.55;color:#d6d4e8;margin-top:6px}
.lang-row{padding:14px 0;border-top:1px solid var(--line)}
.lang-row .r{display:flex;justify-content:space-between;align-items:baseline}
.lang-row span{color:var(--muted);font-size:13px}
.meter{display:flex;gap:5px;margin-top:10px}
.meter i{flex:1;height:6px;border-radius:3px;background:rgba(238,241,247,.12)}
.meter i.f{background:var(--mint)}

#timeline{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(960px,calc(100vw - 48px));padding:14px 20px 8px;background:rgba(23,18,43,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;transition:opacity .8s}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted);margin-bottom:0}
.tl-head strong{color:var(--paper);font-weight:600}
.tl-scroll{overflow-x:auto;scrollbar-width:none}
.tl-inner{min-width:620px;padding-top:16px}
.tl-track{position:relative;height:116px}
.tl-bar{position:absolute;height:16px;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 9px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;transition:box-shadow .2s,transform .2s}
.tl-bar:hover{transform:translateY(-1px)}
.tl-bar.edu{background:var(--violet);color:#1d1240}
.tl-bar.edu.future{background:linear-gradient(90deg,var(--violet) var(--k),rgba(169,140,255,.28) var(--k))}
.tl-bar.work{background:var(--amber);color:#3a2300}
.tl-bar.ongoing{background:linear-gradient(90deg,var(--amber) 60%,rgba(255,179,71,.25))}
.tl-bar.active{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--paper)}
.tl-axis{position:relative;height:22px;border-top:1px solid var(--line)}
.tl-axis span{position:absolute;top:5px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-now{position:absolute;top:0;bottom:-4px;width:2px;background:var(--mint);border-radius:2px}
.tl-now span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--mint);white-space:nowrap}

#hint{position:fixed;left:28px;bottom:30px;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:200px;transition:opacity .8s}

#intro{position:fixed;inset:0;display:flex;align-items:center;background:linear-gradient(90deg,rgba(17,13,33,.94) 0%,rgba(17,13,33,.6) 42%,rgba(17,13,33,0) 66%);transition:opacity 1.1s ease;z-index:5;padding:24px 7vw}
#intro.gone{opacity:0;pointer-events:none}
.intro-inner{max-width:640px}
.intro-inner .pre{font-size:15px;color:var(--mint);font-weight:600}
.intro-inner h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,7.4vw,112px);line-height:.92;letter-spacing:-.035em;margin:16px 0 22px}
.intro-inner h1 span{display:block;font-weight:400;font-size:.62em;letter-spacing:-.02em;color:var(--violet);margin-top:.12em}
.intro-inner .role{font-size:clamp(15px,1.6vw,18px);line-height:1.55;color:#dcdaee;max-width:520px}
.intro-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:32px}
#start{font-size:16px;font-weight:700;padding:15px 28px;border-radius:999px;background:var(--mint);color:#0f2a24;box-shadow:0 10px 40px -10px rgba(124,240,208,.55);transition:transform .2s}
#start:hover{transform:translateY(-2px)}
.intro-actions a{font-size:14.5px;font-weight:600;padding:14px 20px;border-radius:999px;border:1px solid var(--line);color:var(--paper);text-decoration:none}
.intro-actions a:hover{border-color:var(--mint);color:var(--mint)}

body.pre nav>:not(.lang){display:none}
body.pre .brand,body.pre #timeline,body.pre #labels,body.pre #hint{opacity:0;pointer-events:none}
#credit{position:fixed;right:28px;bottom:24px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted);transition:opacity .8s}
#credit img{height:48px;width:auto;display:block}
.pcredit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pcredit img{height:40px;width:auto;display:block}
@media (max-width:1279px){#credit{display:none}}
body.panel-open #hint{opacity:0}

@media (max-width:1100px){#hint{display:none}}
@media (max-width:760px){
  #intro{align-items:flex-start;padding-top:13vh;background:linear-gradient(180deg,rgba(17,13,33,.95) 0%,rgba(17,13,33,.72) 50%,rgba(17,13,33,0) 74%)}
  #top{padding:14px;flex-direction:column}
  .brand h1{font-size:20px}
  nav{justify-content:flex-start}
  nav button,nav a{font-size:12px;padding:7px 12px}
  body.pre #top{flex-direction:row;justify-content:flex-end}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:58vh;border-radius:20px;transform:translateY(110%);padding:24px 22px 18px}
  #panel h2{font-size:24px}
  #timeline{bottom:10px;width:calc(100vw - 20px);padding:10px 12px 4px}
  body.panel-open #timeline{opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

  controls.enabled=false;}

  camera.position.copy(dir.multiplyScalar(flight.l0+(flight.l1-flight.l0)*k+Math.sin(Math.PI*k)*flight.arc));
  controls.target.lerpVectors(flight.t0,flight.t1,k);camera.lookAt(controls.target);

    <div class="links"><a class="primary" href="${PORTFOLIO}" target="_blank" rel="noopener">${lang==='pt'?'Abrir portfólio de IA':'Open AI portfolio'}</a><a href="${GITHUB}" target="_blank" rel="noopener">GitHub</a></div>
    <div class="pcredit"><span>${t(S.madeByLong)}</span><img src="ory-logo.png" alt="ORY"></div>
    <div class="pnav"><button data-go="lia"><small>${lang==='pt'?'Comece pelo presente':'Start with today'}</small>LIA · UFMS</button><button data-open="contato"><small>${lang==='pt'?'Fale com ele':'Get in touch'}</small>${t(S.navContact)}</button></div>`,
  projects:()=>`<p class="kicker">${lang==='pt'?'O grafo em órbita':'The orbiting graph'}</p><h2>${lang==='pt'?'Projetos em destaque':'Featured projects'}</h2>
    <p class="org">${lang==='pt'?'Cada nó do grafo que circula o planeta é um projeto. Os pacotes laranja correm pelas arestas como mensagens entre agentes.':'Each node of the graph circling the planet is a project. The orange packets travel along the edges like messages between agents.'}</p>
    ${PROJECTS.map((p,i)=>`<button class="card" data-open="proj:${i}" style="--c:${p.color}"><strong><i></i>${t(p.short)}</strong><p>${t(p.title)}</p></button>`).join('')}`,
  skills:()=>`<p class="kicker">${t(S.skillsRing)}</p><h2>${lang==='pt'?'Habilidades técnicas':'Technical skills'}</h2>
    <p class="org">${lang==='pt'?'As mesmas tecnologias que giram no anel em volta do planeta.':'The same technologies spinning in the ring around the planet.'}</p>
    ${SKILL_GROUPS.map(s=>`<div class="card" style="--c:${s.color}"><strong><i></i>${t(s.name)}</strong><p>${t(s.text)}</p></div>`).join('')}`,
  languages:()=>`<p class="kicker">${lang==='pt'?'O satélite':'The satellite'}</p><h2>${t(S.languages)}</h2>
    <div class="lang-row" style="margin-top:18px"><div class="r"><strong>${lang==='pt'?'Português':'Portuguese'}</strong><span>${lang==='pt'?'nativo':'native'}</span></div><div class="meter">${'<i class="f"></i>'.repeat(5)}</div></div>
    <div class="lang-row"><div class="r"><strong>${lang==='pt'?'Inglês':'English'}</strong><span>${lang==='pt'?'avançado':'advanced'}</span></div><div class="meter">${'<i class="f"></i>'.repeat(4)}<i></i></div><p class="org" style="margin-top:10px">${lang==='pt'?'Leitura, escrita e conversação.':'Reading, writing and conversation.'}</p></div>`,
  contato:()=>`<p class="kicker">${t(S.navContact)}</p><h2>${lang==='pt'?'Vamos construir algo com agentes?':'Let’s build something with agents'}</h2>
    <div class="contact" style="margin-top:22px">
      <div class="crow"><div><strong>murilogabassan@gmail.com</strong><span>E-mail</span></div><button class="copy" data-copy="murilogabassan@gmail.com">${t(S.copy)}</button></div>
      <div class="crow"><div><strong>+55 67 99100-7539</strong><span>${lang==='pt'?'Telefone e WhatsApp':'Phone & WhatsApp'}</span></div><button class="copy" data-copy="+55 67 99100-7539">${t(S.copy)}</button></div>
      <a class="row" href="https://wa.me/5567991007539" target="_blank" rel="noopener">${lang==='pt'?'Abrir conversa no WhatsApp':'Open a WhatsApp chat'} <span>wa.me</span></a>
      <a class="row" href="${GITHUB}" target="_blank" rel="noopener">github.com/murilo-bassan <span>GitHub</span></a>
      <a class="row" href="${PORTFOLIO}" target="_blank" rel="noopener">AI Engineering Portfolio <span>${t(S.navPortfolio)}</span></a>
      <div class="crow"><div><strong style="user-select:text">Campo Grande, MS, ${lang==='pt'?'Brasil':'Brazil'}</strong><span>${lang==='pt'?'Localização':'Location'}</span></div></div>
    </div>`,
};
function render(key){if(PANELS[key])return PANELS[key]();if(key.startsWith('proj:'))return projectPanel(+key.slice(5));return placePanel(key);}
function showPanel(key){activeKey=key;pbody.innerHTML=render(key);panel.classList.add('open');document.body.classList.add('panel-open');panel.scrollTop=0;syncActive();}
function closePanel(){panel.classList.remove('open');document.body.classList.remove('panel-open');activeKey=null;syncActive();}
function syncActive(){labels.forEach(L=>L.el.classList.toggle('active',L.key===activeKey));document.querySelectorAll('.tl-bar').forEach(b=>b.classList.toggle('active',b.dataset.key===activeKey));}
function handleKey(key){if(placeMap[key])return focusPlace(key);stopTour();showPanel(key);}
pbody.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){const strong=cp.previousElementSibling.querySelector('strong');const sel=()=>getSelection().selectAllChildren(strong);
    try{navigator.clipboard.writeText(cp.dataset.copy).then(()=>{cp.textContent=t(S.copied);setTimeout(()=>cp.textContent=t(S.copy),1600);},sel);}catch(_){sel();}return;}
  const go=e.target.closest('[data-go]'),op=e.target.closest('[data-open]');
  if(go)focusPlace(go.dataset.go);else if(op)handleKey(op.dataset.open);
});
document.getElementById('close').onclick=closePanel;
document.querySelectorAll('#top [data-open]').forEach(b=>b.addEventListener('click',()=>handleKey(b.dataset.open)));
document.getElementById('overviewBtn').onclick=()=>{closePanel();overview();};
addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();if(mode==='place')overview();}});

/* ================================================================ timeline */
function buildTimeline(){
  const track=document.getElementById('tlTrack'),axis=document.getElementById('tlAxis');track.innerHTML='';axis.innerHTML='';
  const pct=y=>(y-T0)/(T1-T0)*100;
  TL.forEach((b,i)=>{const el=document.createElement('button');el.className='tl-bar '+b.type;el.dataset.key=b.key;
    el.style.left=pct(b.from)+'%';el.style.width=(pct(b.to)-pct(b.from))+'%';el.style.top=(i*19)+'px';el.textContent=t(b.label);
    if(b.type==='edu'&&b.to>NOW){el.classList.add('future');el.style.setProperty('--k',((NOW-b.from)/(b.to-b.from)*100)+'%');}
    el.onclick=()=>focusPlace(b.key);track.appendChild(el);});
  for(let y=T0;y<=T1;y++){const s=document.createElement('span');s.textContent=y;s.style.left=pct(y)+'%';if(y===T0)s.style.transform='none';if(y===T1)s.style.transform='translateX(-100%)';axis.appendChild(s);}
  const now=document.createElement('div');now.className='tl-now';now.style.left=pct(NOW)+'%';now.innerHTML=`<span>${t(S.now)}</span>`;track.appendChild(now);
  syncActive();
}

/* ================================================================ language */
function applyLang(){
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(S[el.dataset.i18n]));
  document.querySelectorAll('.lang [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  tourBtn.textContent=t(tour?S.tourStop:S.tourStart);
  labels.forEach(L=>L.el.querySelector('.txt').textContent=L.textFn());
  buildTimeline();
  if(activeKey)pbody.innerHTML=render(activeKey);
}
document.querySelectorAll('.lang [data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('mgb-lang',lang);}catch(e){}applyLang();}));

/* ================================================================ tour */
const tourBtn=document.getElementById('tourBtn');let tour=null;
function startTour(){closePanel();tour={i:-1,wait:0};tourBtn.textContent=t(S.tourStop);nextTour();}
function nextTour(){tour.i=(tour.i+1)%PLACES.length;tour.wait=7.5;focusPlace(PLACES[tour.i].key,true);}
function stopTour(){if(!tour)return;tour=null;tourBtn.textContent=t(S.tourStart);}
tourBtn.onclick=()=>tour?stopTour():startTour();
applyLang();

/* ================================================================ picking */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null,hoverKey=null;
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  for(const h of ray.intersectObjects(pickTargets,true)){let o=h.object;while(o&&!o.userData.key)o=o.parent;if(o)return o.userData.key;return null;}return null;}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>6||mode==='intro')return;const k=pick(e);if(k)handleKey(k);});
canvas.addEventListener('pointermove',e=>{if(e.buttons||mode==='intro')return;const k=pick(e);
  if(k!==hoverKey){hoverKey=k;canvas.style.cursor=k?'pointer':'';labels.forEach(L=>L.el.classList.toggle('hover',L.key===k));}});
controls.addEventListener('start',()=>{lastInteract=elapsed;stopTour();});

/* ================================================================ intro + deep links */
function begin(){viewShift.target=0;document.getElementById('intro').classList.add('gone');document.body.classList.remove('pre');mode='overview';lastInteract=elapsed;}
document.getElementById('start').onclick=()=>{begin();flyTo(new THREE.Vector3(0,.32,1).normalize().multiplyScalar(overviewDist()),new THREE.Vector3(),3.2,()=>{lastInteract=elapsed-2;});};
const routable=k=>placeMap[k]||PANELS[k]||/^proj:\d$/.test(k);
const deep=decodeURIComponent(location.hash.slice(1));
if(routable(deep)){begin();viewShift.v=0;camera.position.set(0,12,38);if(!placeMap[deep])flyTo(camera.position.clone().setLength(overviewDist()),new THREE.Vector3(),.1);handleKey(deep);}
addEventListener('hashchange',()=>{const k=decodeURIComponent(location.hash.slice(1));if(routable(k)){if(mode==='intro')begin();handleKey(k);}});

/* ================================================================ loop */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;const tt=elapsed,sp=reduced?.2:1;
  viewShift.v+=(viewShift.target-viewShift.v)*Math.min(1,dt*1.6);applyShift();
  stepFlight(dt);
  if(!flight){controls.autoRotate=!reduced&&(mode==='intro'||elapsed-lastInteract>(mode==='place'?6:3.5));controls.autoRotateSpeed=mode==='place'?.5:.35;controls.update();}
  sun.position.copy(sunOffset).applyQuaternion(camera.quaternion).multiplyScalar(40);
  for(const a of animators)a(tt,dt);
  spin.rotation.y+=dt*.05*sp;
  PROJECTS.forEach((p,i)=>{p.node.rotation.y+=dt*.6;p.node.rotation.x=Math.sin(tt*.5+i)*.3;p.halo.lookAt(camera.position);
    const target=activeKey==='proj:'+i?1.4:1;p.node.scale.setScalar(p.node.scale.x+(target-p.node.scale.x)*dt*5);});
  for(const k of packets){const f=((tt*.12*sp)+k.off)%1;k.pk.position.copy(k.curve.getPoint(f));}
  ring.rotation.y+=dt*.03*sp;
  const ringOp=mode==='place'?.12:(activeKey==='skills'?1:.9);
  for(const s of ringSprites)s.material.opacity+=(ringOp-s.material.opacity)*dt*3;
  sat.holder.rotation.y+=dt*.15*sp;sat.s.rotation.z+=dt*.4;
  cloudPivot.rotation.y+=dt*.012;cloudMat.opacity+=((mode==='place'?.2:.92)-cloudMat.opacity)*dt*2.5;
  if(tour&&!flight){tour.wait-=dt;if(tour.wait<=0)nextTour();}
  updateLabels();renderer.render(scene,camera);
});
</script>
